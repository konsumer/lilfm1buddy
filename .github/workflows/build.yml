# Builds the menus (JieLi's toolchain) and the board's program for each board (xiaoplus, xiao, zero, supermini, devkit). On main,
# the web page (site/) goes to GitHub Pages with the program next to it (site/fw/). Settings -> Pages -> Source: GitHub
# Actions.
name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/.jieli
          key: jieli-toolchain-1
      - name: JieLi's toolchain
        run: |
          if [ ! -e ~/.jieli/toolchain ]; then
            mkdir -p ~/.jieli
            curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
            ln -sfn "$(basename "$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)")" ~/.jieli/toolchain
          fi
      - run: JIELI_TOOLCHAIN=~/.jieli/toolchain picker/build.sh
      - uses: actions/cache@v4
        with:
          path: ~/pi32v2
          key: pi32v2-toolchain-23.1.5-2
      - name: pi32v2's toolchain (the loader's)
        run: |
          if [ ! -e ~/pi32v2/bin/clang ]; then
            curl -fL --retry 3 -o /tmp/pi32v2.tar.xz https://github.com/jvitkauskas/pi32v2-llvm/releases/download/pi32v2-23.1.5-2/pi32v2-llvm-23.1.5-2-linux-x64.tar.xz
            mkdir -p ~/pi32v2 && tar -xJf /tmp/pi32v2.tar.xz -C ~/pi32v2 --strip-components=1
          fi
      # the loader is fm1buddy's (third_party/fm1buddy/loader): its tests, and that it builds (its bytes are in
      # third_party/fm1buddy/src/app/mflr_loader.h, kept as they are)
      - run: third_party/fm1buddy/loader/test.sh
      - run: |
          cp third_party/fm1buddy/src/app/mflr_loader.h /tmp/
          PI32V2_TOOLCHAIN=~/pi32v2 third_party/fm1buddy/loader/build.sh
          cp /tmp/mflr_loader.h third_party/fm1buddy/src/app/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run -e xiaoplus -e xiao -e zero -e supermini -e devkit
      - name: the page, with the program and the menus
        run: tools/site.sh
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            site/fw/
            build/lilfm1.bin
            build/lilsmk.bin
            build/mflr-loader.bin
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
