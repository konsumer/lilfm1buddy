; lilfm1buddy, the ESP32 side. For now:
;
;   cyd   on an fm1buddy board (the CYD-S3): the picker into the FM-1's RAM through its boot ROM, its list from the
;         board's flash (data/fm1/*.fwsc), and the install of the one picked on the FM-1.
;         tools/data.sh, then pio run -e cyd -t uploadfs (the files) and pio run -e cyd -t upload (the program)
;
; It builds fm1buddy's board code (third_party/fm1buddy/src) with its own main (esp32/) in place of fm1buddy's. The
; board settings are fm1buddy's cyd-s3 ones, copied.

[platformio]
src_dir = .
data_dir = data
default_envs = cyd

[env:cyd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; the program (2.5 MB), and the rest for its files (LittleFS, from data/: pio run -t uploadfs)
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_src_filter =
    +<esp32/>
    +<third_party/fm1buddy/src/app/>
    +<third_party/fm1buddy/src/s3/>
    -<third_party/fm1buddy/src/s3/main.cpp>
build_flags =
    -I third_party/fm1buddy/src/app
    -I third_party/fm1buddy/src/s3
    -D LV_CONF_INCLUDE_SIMPLE=1
    ; crashes kept for the log (hal_s3.cpp onPanic): Arduino's panic hook is a wrapper the link has to ask for
    -Wl,--wrap=esp_panic_handler
    ; the USB-C port is USB serial (flashing, logs) until it becomes the USB host
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; the touch panel (FT6336, I2C)
    -D TOUCH_SDA=16
    -D TOUCH_SCL=15
    -D TOUCH_RST=18
    -D TOUCH_INT=17
    ; the SD card (4-bit SD_MMC)
    -D SD_CLK=38
    -D SD_CMD=40
    -D SD_D0=39
    -D SD_D1=41
    -D SD_D2=48
    -D SD_D3=47
    ; the RGB LED (WS2812)
    -D LED_RGB=42
    -D CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    ; the USB host: TinyUSB
    '-D CFG_TUSB_CONFIG_FILE="tusb_config_fm1buddy.h"'
    ; the screen (TFT_eSPI): ILI9341
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D USE_HSPI_PORT=1
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=46
    -D TFT_RST=-1
    -D TFT_BL=45
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    ; TFT_eSPI's own fonts, for the board's lines (fm1buddy draws with LVGL: it has none)
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
lib_deps =
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@7.2.1
    bodmer/TFT_eSPI@2.5.43
    h2zero/NimBLE-Arduino@2.5.1
    https://github.com/hathach/tinyusb.git#0.21.0
