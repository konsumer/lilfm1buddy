; lilfm1buddy, the ESP32 side. For now:
;
;   cyd   on an fm1buddy board (the CYD-S3): the picker into the FM-1's RAM through its boot ROM, its list from the SD
;         card (/fm1/*.fwsc), and the install of the one picked on the FM-1. pio run -e cyd -t upload
;
; It builds on fm1buddy's board code (third_party/fm1buddy), with its own main (esp32/) in place of fm1buddy's.

[platformio]
src_dir = .
default_envs = cyd
extra_configs = third_party/fm1buddy/platformio.ini

[env:cyd]
extends = env:cyd-s3
build_src_filter =
    +<esp32/>
    +<third_party/fm1buddy/src/app/>
    +<third_party/fm1buddy/src/s3/>
    -<third_party/fm1buddy/src/s3/main.cpp>
build_flags =
    ${env:cyd-s3.build_flags}
    -I third_party/fm1buddy/src/app
    -I third_party/fm1buddy/src/s3
    ; TFT_eSPI's own fonts, for the board's lines (fm1buddy draws with LVGL: it has none)
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
