; lilfm1buddy, the ESP32 side, one build for each board (pio run -e xiao -t upload, or the web page):
;
;   xiao    Seeed XIAO ESP32S3: 8 MB flash (about 10 firmwares), a LiPo charger, its LED blinks what it's doing
;   zero    Waveshare ESP32-S3-Zero: the smallest, 4 MB flash (3 or 4 firmwares), its RGB LED in colours
;   devkit  any ESP32-S3 with 16 MB flash and PSRAM (N16R8, like the DevKitC-1): about 20 firmwares, RGB LED on 48
;   cyd     the same on an fm1buddy board (the CYD-S3), with what it's doing on its screen too: to see it while working
;
; Each one's USB-C port is the chip's own USB, on the FM-1's. They build fm1buddy's board code
; (third_party/fm1buddy/src) with their own main (esp32/) in place of fm1buddy's, and the picker in the program
; (build/picker.bin: picker/build.sh first). The firmwares, and JieLi's loader, are files in the board's flash
; (LittleFS), sent by the web page over USB serial (esp32/main.cpp says how).

[platformio]
src_dir = .
default_envs = xiao

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; the program, and the rest of the flash for files (LittleFS): flash-*.csv
board_build.filesystem = littlefs
board_build.embed_files = build/picker.bin
build_src_filter =
    +<esp32/>
    +<third_party/fm1buddy/src/app/>
    +<third_party/fm1buddy/src/s3/>
    -<third_party/fm1buddy/src/s3/main.cpp>
build_flags =
    -I third_party/fm1buddy/src/app
    -I third_party/fm1buddy/src/s3
    -D LV_CONF_INCLUDE_SIMPLE=1
    ; crashes kept for the log (hal_s3.cpp onPanic): Arduino's panic hook is a wrapper the link has to ask for
    -Wl,--wrap=esp_panic_handler
    ; the USB-C port is USB serial (flashing, the web page) until it becomes the USB host
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    ; the USB host: TinyUSB
    '-D CFG_TUSB_CONFIG_FILE="tusb_config_fm1buddy.h"'
lib_deps =
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@7.2.1
    h2zero/NimBLE-Arduino@2.5.1
    https://github.com/hathach/tinyusb.git#0.21.0

[env:xiao]
extends = common
board = seeed_xiao_esp32s3
board_build.partitions = flash-8mb.csv
build_flags =
    ${common.build_flags}
    ; its user LED (one colour), lit when low
    -D LED_PIN=21
    -D LED_ON=LOW
    ; no screen (fm1buddy's hal::backlight wants a pin: it's never called here)
    -D TFT_BL=-1

[env:zero]
extends = common
board = waveshare_esp32_s3_zero
board_build.partitions = flash-4mb.csv
build_flags =
    ${common.build_flags}
    -D LED_RGB=21
    -D TFT_BL=-1

[env:devkit]
extends = common
board = esp32-s3-devkitc1-n16r8
board_build.partitions = flash-16mb.csv
build_flags =
    ${common.build_flags}
    -D LED_RGB=48
    -D TFT_BL=-1

[env:cyd]
extends = common
board = esp32-s3-devkitc1-n16r8
board_build.partitions = flash-16mb.csv
build_flags =
    ${common.build_flags}
    -D SCREEN=1
    ; fm1buddy's cyd-s3 pins, copied
    -D SD_CLK=38
    -D SD_CMD=40
    -D SD_D0=39
    -D SD_D1=41
    -D SD_D2=48
    -D SD_D3=47
    -D LED_RGB=42
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D USE_HSPI_PORT=1
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=46
    -D TFT_RST=-1
    -D TFT_BL=45
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    ; TFT_eSPI's own fonts, for the board's lines (fm1buddy draws with LVGL: it has none)
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
lib_deps =
    ${common.lib_deps}
    bodmer/TFT_eSPI@2.5.43
