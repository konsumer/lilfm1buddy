; lilfm1buddy, the ESP32 side, one build for each board (pio run -e zero -t upload, or the web page):
;
;   xiaoplus  Seeed XIAO ESP32S3 Plus: 16 MB flash, a LiPo charger, its battery's level on the FM-1
;   xiao      Seeed XIAO ESP32S3: 8 MB flash, a LiPo charger
;   zero      Waveshare ESP32-S3-Zero: the smallest, 4 MB flash, an RGB LED
;   devkit    any ESP32-S3 with 16 MB flash and PSRAM (N16R8, like the DevKitC-1), an RGB LED on 48
;
; Each one's USB-C port is the chip's own USB, on the FM-1's. They build the parts of fm1buddy's code they need
; (third_party/fm1buddy/src: the USB host, the key, MIDI routing, Bluetooth MIDI, packages) with their own (esp32/).
; The rest of the flash is a FAT drive (flash-*.csv): the program is all that isn't.

[platformio]
src_dir = .
default_envs = xiaoplus

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter =
    +<esp32/>
    +<third_party/fm1buddy/src/s3/usb_s3.cpp>
    +<third_party/fm1buddy/src/s3/key_s3.cpp>
    +<third_party/fm1buddy/src/s3/ble_s3.cpp>
    +<third_party/fm1buddy/src/app/midi.cpp>
    +<third_party/fm1buddy/src/app/midimap.cpp>
    +<third_party/fm1buddy/src/app/play.cpp>
    +<third_party/fm1buddy/src/app/fm1.cpp>
build_flags =
    -I esp32
    -I third_party/fm1buddy/src/app
    -I third_party/fm1buddy/src/s3
    ; the USB-C port is USB serial (flashing, the log) until it's the USB host or a USB drive
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    ; the USB host: TinyUSB
    '-D CFG_TUSB_CONFIG_FILE="tusb_config_fm1buddy.h"'
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    https://github.com/hathach/tinyusb.git#0.21.0

[env:xiaoplus]
extends = common
board = seeed_xiao_esp32_s3_plus
board_build.partitions = flash-16mb.csv
build_flags =
    ${common.build_flags}
    ; its user LED (one colour), lit when low
    -D LED_PIN=21
    -D LED_ON=LOW
    ; its battery, on GPIO 10 (ADC_BAT) through a divider (taken to halve it: Seeed doesn't say)
    -D BAT_ADC=10
    -D BAT_DIV=2

[env:xiao]
extends = common
board = seeed_xiao_esp32s3
board_build.partitions = flash-8mb.csv
build_flags =
    ${common.build_flags}
    -D LED_PIN=21
    -D LED_ON=LOW

[env:zero]
extends = common
board = waveshare_esp32_s3_zero
board_build.partitions = flash-4mb.csv
build_flags =
    ${common.build_flags}
    -D LED_RGB=21
    ; its colours swapped (red for green)? Some take them in another order:
    ; -D LED_ORDER=LED_COLOR_ORDER_RGB

[env:devkit]
extends = common
board = esp32-s3-devkitc1-n16r8
board_build.partitions = flash-16mb.csv
build_flags =
    ${common.build_flags}
    -D LED_RGB=48
